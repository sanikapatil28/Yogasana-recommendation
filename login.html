{% extends "base.html" %}

{% block title %}
Login - YogaSutra AI
{% endblock %}


{% block content %}

<section class="auth-section">

    <div class="auth-container">

        <div class="auth-header">

            <div class="auth-icon">
                🧘
            </div>

            <h1>Welcome Back</h1>

            <p>
                Continue your personalized yoga journey.
            </p>

        </div>


        <form method="POST" class="auth-form">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Login →
            </button>


            <p class="auth-switch">

                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Create Account
                </a>

            </p>

        </form>

    </div>

</section>

{% endblock %}
